name: Volo pickup watcher

on:
  schedule:
    - cron: '*/15 * * * *' # every 15 min (GitHub may delay runs a few minutes)
  workflow_dispatch: {} # "Run workflow" button for manual tests

permissions:
  contents: write # to commit state.json back

concurrency:
  group: volo-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json') }}

      - run: npx playwright install --with-deps chromium

      - name: Check Volo
        env:
          SPORTS: ${{ vars.SPORTS || 'volleyball' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node watch.mjs

      - name: Save state
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "volo-watcher"
            git config user.email "volo-watcher@users.noreply.github.com"
            git add state.json
            git commit -m "update state [skip ci]"
            git push
          fi
